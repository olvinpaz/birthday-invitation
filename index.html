<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer Añito - Alana Marie</title>

    <!-- Meta etiquetas Open Graph (WhatsApp, Facebook, etc.) -->
    <meta property="og:title" content="🎈 Primer Añito - Alana Marie 🎈">
    <meta property="og:description" content="Queremos que nos acompañes a celebrar este día tan especial. ¡No faltes!">
    <meta property="og:image"
        content="https://olvinpaz.github.io/birthday-invitation/assets/images/Cielo_pastel_con_arcoíris_y_sol.jpg">
    <meta property="og:url" content="https://olvinpaz.github.io/birthday-invitation/">
    <meta property="og:type" content="website">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/card.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Pacifico&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Start Overlay -->
    <div id="start-overlay" class="start-overlay">
        <button id="btn-start" class="btn x-btn-primary btn-play"
            style="font-size: 1.3rem; padding: 20px 40px; border-radius: 50px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
            </svg>
            Presiona para ver la invitación
        </button>
    </div>

    <!-- Audio -->
    <audio id="bg-music" src="assets/audio/alana.mp3"></audio>
    <!-- <button id="music-btn" class="music-btn" aria-label="Reproducir música">
        <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="currentColor">
            <path d="M8 5v14l11-7z" />
        </svg>
        <svg id="icon-pause" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
        </svg>
    </button> -->

    <!-- Intro Container -->
    <div id="intro-container" class="intro-container">
        <!-- Animatable Elements: SVG/CSS -->
        <div class="sky-elements">
            <!-- Nubes SVG inline -->
            <svg class="cloud cloud-1" viewBox="0 0 24 24" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M17.5 19c2.485 0 4.5-2.015 4.5-4.5S19.985 10 17.5 10c-.17 0-.336.012-.498.033C16.326 7.106 13.894 5 11 5 7.134 5 4 8.134 4 12c0 .484.05.956.143 1.41C2.348 13.916 1 15.548 1 17.5 1 19.985 3.015 22 5.5 22h12z" />
            </svg>
            <svg class="cloud cloud-2" viewBox="0 0 24 24" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M17.5 19c2.485 0 4.5-2.015 4.5-4.5S19.985 10 17.5 10c-.17 0-.336.012-.498.033C16.326 7.106 13.894 5 11 5 7.134 5 4 8.134 4 12c0 .484.05.956.143 1.41C2.348 13.916 1 15.548 1 17.5 1 19.985 3.015 22 5.5 22h12z" />
            </svg>
            <!-- Sol -->
            <div class="sun"></div>
            <!-- Arcoíris -->
            <div class="rainbow">
                <div class="arc arc-1"></div>
                <div class="arc arc-2"></div>
                <div class="arc arc-3"></div>
                <div class="arc arc-4"></div>
            </div>
            <!-- Contenedores dinámicos generados en JS -->
            <div id="stars-container" class="stars-container"></div>
            <div id="hearts-container" class="hearts-container"></div>
        </div>
        <div class="intro-text">
            <h1 id="text-line-1" class="typewriter"></h1>
            <p id="text-line-2" class="typewriter-sub"></p>
        </div>
    </div>

    <!-- Main Card Container -->
    <div id="main-card-container" class="main-card-container hidden">
        <canvas id="confetti-canvas"></canvas>
        <div class="card-content">
            <!-- <div class="image-wrapper">
                <img src="assets/images/Cielo_pastel_con_arcoíris_y_sol.jpg" alt="Cielo pastel con arcoíris" id="main-image">
            </div> -->

            <div class="invitation-details">
                <h2 class="title-main">Primer Añito</h2>
                <h3 class="name-main">Alana Marie Pérez Carranza</h3>

                <div class="info-grid">
                    <div class="info-item">
                        <span class="label">Fecha</span>
                        <span class="value">9 de agosto</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Hora</span>
                        <span class="value">2:30 PM</span>
                    </div>
                </div>

                <div class="location-box">
                    <span class="label">Lugar:</span>
                    <span class="value">Área Social de Res. Vizcaya</span>
                </div>

                <div class="countdown-container">
                    <div class="cd-box"><span id="cd-days">00</span><small>Días</small></div>
                    <div class="cd-box"><span id="cd-hours">00</span><small>Horas</small></div>
                    <div class="cd-box"><span id="cd-mins">00</span><small>Minutos</small></div>
                    <div class="cd-box"><span id="cd-secs">00</span><small>Segundos</small></div>
                </div>

                <div class="action-buttons">
                    <a href="https://www.google.com/maps/place/Residencial+Vizcaya/@13.3253922,-87.1492451,291m/data=!3m1!1e3!4m6!3m5!1s0x8f703d5680ed8a3d:0x931c712f4b846dec!8m2!3d13.3249284!4d-87.1480466!16s%2Fg%2F11g2xbz3bz"
                        target="_blank" class="btn btn-primary" rel="noopener noreferrer">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        Ver Ubicación
                    </a>
                    <button id="btn-rsvp" class="btn btn-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                            </path>
                        </svg>
                        Confirmar Asistencia
                    </button>
                </div>

                <div class="gift-card">
                    <div class="gift-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 12 20 22 4 22 4 12"></polyline>
                            <rect x="2" y="7" width="20" height="5"></rect>
                            <line x1="12" y1="22" x2="12" y2="7"></line>
                            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
                            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
                        </svg>
                    </div>
                    <p class="gift-message">Tu presencia será el regalo más especial para nosotros.</p>
                    <p class="gift-details">Si deseas obsequiar algo agradeceremos sea en efectivo</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="js/music.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/countdown.js"></script>
    <script src="js/invitation.js"></script>
    <script src="js/transition.js"></script>
    <script src="js/intro.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
